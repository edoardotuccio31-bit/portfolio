<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Edoardo Tuccio — Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --red:#E10600; --red2:#FF5A4D; --ink:#141414; --grey:#2B2B2B; --mid:#8A8782; --paper:#F3F0EA; --white:#FFFFFF;
  --disp:'Anton','Inter Display','Inter','Arial Narrow',Impact,sans-serif;
  --text:'Inter','Helvetica Neue',Arial,sans-serif;
  --mono:'JetBrains Mono','DejaVu Sans Mono',ui-monospace,Menlo,monospace;
  --pad:clamp(16px,3.2vw,44px);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--text);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit;-webkit-user-drag:none}
.row,.next,.nav a,.logo,.btn,.ph-meta a{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;cursor:pointer}
.row *{pointer-events:none}
img{max-width:100%;display:block;-webkit-user-drag:none}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--red);outline-offset:3px}
.mono{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.disp{font-family:var(--disp);text-transform:uppercase;line-height:.88;letter-spacing:.005em;font-weight:400}

/* ---------- top bar ---------- */
.top{position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px var(--pad);background:var(--paper);border-bottom:2px solid var(--ink)}
.top-left{display:flex;align-items:center;gap:14px}
.lang{display:flex;border:2px solid var(--ink)}
.lang button{border:0;background:transparent;padding:5px 9px;font-family:var(--mono);font-size:12px;font-weight:700;letter-spacing:.08em}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.logo{font-family:var(--disp);font-size:26px;line-height:1;text-decoration:none;display:flex;align-items:center;gap:6px}
.logo i{display:inline-block;width:12px;height:12px;background:var(--red)}
.nav{display:flex;gap:clamp(12px,2.4vw,30px)}
.nav a{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;text-decoration:none;padding:6px 0;border-bottom:2px solid transparent}
.nav a:hover,.nav a.on{border-bottom-color:var(--red)}

/* ---------- hero ---------- */
.hero{position:relative;padding:clamp(20px,4vw,48px) var(--pad) clamp(10px,2vw,24px);display:grid;grid-template-columns:repeat(12,1fr);gap:20px;align-items:end}
.hero-meta{grid-column:1/-1;display:flex;justify-content:space-between;border-bottom:2px solid var(--ink);padding-bottom:8px}
.hero h1{grid-column:1/8;margin:0;font-size:clamp(76px,17.5vw,280px)}
.hero h1 span{display:block}
.hero-side{grid-column:8/-1;align-self:stretch;display:flex;flex-direction:column;justify-content:flex-end;gap:16px;padding-bottom:10px}
.tagbox{background:var(--red);color:var(--ink);padding:14px 16px;font-family:var(--disp);text-transform:uppercase;font-size:clamp(24px,3.4vw,50px);line-height:.95}
.hero-lead{font-family:var(--mono);font-size:clamp(12px,1.05vw,15px);text-transform:uppercase;letter-spacing:.06em;line-height:1.55;border-top:2px solid var(--ink);border-bottom:2px solid var(--ink);padding:12px 0;margin:0}
.stage{position:relative;flex:1;min-height:clamp(170px,19vw,300px)}
.stage .stk{left:12%;top:8%;width:74%}
.stage-hint{position:absolute;right:0;top:0;color:var(--mid)}
.stk{position:absolute;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none;background:none;border:0;padding:0;transition:transform .25s cubic-bezier(.3,1.6,.5,1),filter .2s;filter:drop-shadow(0 2px 0 rgba(0,0,0,.25));z-index:5;will-change:transform}
.stk img{pointer-events:none;width:100%;height:auto;animation:idle 5s ease-in-out infinite}
.stk:nth-child(odd) img{animation-duration:6.5s;animation-direction:reverse}
.stk:hover{transform:rotate(var(--r,0deg)) scale(1.06)}
.stk.drag{cursor:grabbing;transform:rotate(calc(var(--r,0deg) + 6deg)) scale(1.14);filter:drop-shadow(10px 16px 0 rgba(0,0,0,.28));transition:none;z-index:40}
.stk.drag img{animation:none}
.stk.pop img{animation:pop .5s ease}
@keyframes idle{0%,100%{transform:rotate(-2.5deg) translateY(0)}50%{transform:rotate(2.5deg) translateY(-6px)}}
@keyframes pop{0%{transform:scale(1)}35%{transform:scale(1.18,.86) translateY(8px)}70%{transform:scale(.92,1.12) translateY(-22px)}100%{transform:scale(1)}}
.bubble{position:absolute;left:50%;bottom:100%;transform:translate(-50%,-6px);background:var(--paper);color:var(--ink);border:2px solid var(--ink);padding:6px 10px;font-family:var(--mono);font-size:12px;font-weight:700;white-space:nowrap;pointer-events:none;z-index:60;box-shadow:4px 4px 0 var(--red)}

/* ---------- marquee ---------- */
.mq{overflow:hidden;border-top:2px solid var(--ink);border-bottom:2px solid var(--ink);background:var(--red);color:var(--ink);margin-top:clamp(28px,5vw,64px)}
.mq.dark{background:var(--ink);color:var(--paper);margin-top:0;border:0}
.mq div{display:inline-flex;white-space:nowrap;animation:mq 28s linear infinite;font-family:var(--disp);text-transform:uppercase;font-size:clamp(22px,3vw,40px);padding:8px 0}
.mq span{padding-right:.6em}
.mq:hover div{animation-play-state:paused}
@keyframes mq{to{transform:translateX(-50%)}}

/* ---------- sections ---------- */
.sec{padding:clamp(28px,5vw,64px) var(--pad)}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px solid var(--ink);padding-bottom:8px;margin-bottom:0}
.sec-head h2{margin:0;font-family:var(--disp);text-transform:uppercase;font-weight:400;font-size:clamp(30px,4.4vw,60px);line-height:1}

.row{display:grid;grid-template-columns:repeat(12,1fr);gap:20px;align-items:center;padding:clamp(18px,2.6vw,34px) 0;border-bottom:2px solid var(--ink);text-decoration:none;position:relative;transition:background .18s,color .18s,padding .18s}
@media (hover:hover){.row:hover{background:var(--red);padding-left:16px;padding-right:16px}}
.row .n{grid-column:1/2;font-family:var(--disp);font-size:clamp(22px,2.6vw,38px)}
.row .tt{grid-column:2/7}
.row .tt h3{margin:0;font-family:var(--disp);font-weight:400;text-transform:uppercase;line-height:.9;font-size:clamp(40px,6.6vw,104px)}
.row .tt .mono{display:block;margin-top:10px}
.row .bl{grid-column:7/11;font-size:15px;max-width:44ch}
.row .go{grid-column:11/-1;justify-self:end;font-family:var(--mono);font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}
.row .go b{display:inline-block;transition:transform .2s;font-size:20px;vertical-align:-2px;margin-left:6px}
@media (hover:hover){.row:hover .go b{transform:translateX(8px)}}
.row .peek{position:absolute;right:16%;top:50%;width:calc(clamp(78px,10vw,150px) * var(--ms,1));transform:translateY(-50%) rotate(-8deg) scale(0);transition:transform .3s cubic-bezier(.3,1.6,.5,1);pointer-events:none;filter:drop-shadow(4px 6px 0 rgba(0,0,0,.25))}
@media (hover:hover){.row:hover .peek{transform:translateY(-50%) rotate(6deg) scale(1)}}

/* ---------- project page ---------- */
.ph{padding:clamp(18px,3vw,36px) var(--pad) 0}
.ph-meta{display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid var(--ink);padding-bottom:8px}
.ph-meta a{position:relative;z-index:30;padding:10px 14px 10px 0;margin:-10px 0;font-weight:700;display:inline-block}
.ph-meta a:active{color:var(--red)}
.ph h1{margin:.08em 0 0;font-size:clamp(64px,15.5vw,250px);word-break:break-word}
.ph-grid{display:grid;grid-template-columns:repeat(12,1fr);gap:20px;margin-top:18px;align-items:start}
.ph-tag{grid-column:1/7;background:var(--red);padding:14px 16px;font-family:var(--disp);text-transform:uppercase;font-size:clamp(22px,3vw,44px);line-height:.98;position:relative}
.ph-lead{grid-column:7/-1;font-family:var(--mono);font-size:clamp(12px,1.05vw,15px);text-transform:uppercase;letter-spacing:.06em;line-height:1.6;border-top:2px solid var(--ink);border-bottom:2px solid var(--ink);padding:12px 0;margin:0}
.ph-masc{position:absolute;right:-18px;top:-64px;width:calc(clamp(78px,9vw,136px) * var(--ms,1))}
.facts{display:grid;grid-template-columns:repeat(4,1fr);border-top:2px solid var(--ink);border-bottom:2px solid var(--ink);margin:clamp(22px,3.5vw,44px) var(--pad) 0}
.facts div{padding:12px 14px 14px 0;border-right:1px solid var(--ink);padding-left:14px}
.facts div:first-child{padding-left:0}
.facts div:last-child{border-right:0}
.facts dt{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--red);font-weight:700}
.facts dd{margin:4px 0 0;font-weight:600;font-size:15px}
.body{display:grid;grid-template-columns:repeat(12,1fr);gap:20px;padding:clamp(24px,4vw,56px) var(--pad)}
.blk{grid-column:1/-1;display:grid;grid-template-columns:repeat(12,1fr);gap:20px;border-top:2px solid var(--ink);padding-top:12px;padding-bottom:clamp(16px,2.6vw,34px)}
.blk h2{grid-column:1/5;margin:0;font-family:var(--disp);font-weight:400;text-transform:uppercase;font-size:clamp(26px,3.2vw,46px);line-height:1}
.blk h2 small{display:block;font-family:var(--mono);font-size:12px;color:var(--red);font-weight:700;letter-spacing:.08em;margin-bottom:8px}
.blk .tx{grid-column:5/11;font-size:clamp(16px,1.35vw,20px);line-height:1.5}
.blk .tx p{margin:0 0 .8em}
.blk .wide{grid-column:1/-1}
.btn{display:inline-flex;align-items:center;gap:10px;background:var(--ink);color:var(--paper);text-decoration:none;font-family:var(--mono);font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:12px 16px;border:2px solid var(--ink);transition:background .15s,color .15s,transform .15s}
.btn:hover{background:var(--red);color:var(--ink);transform:translate(-2px,-2px);box-shadow:4px 4px 0 var(--ink)}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:0;border:2px solid var(--ink)}
.steps li{list-style:none;padding:14px;border-right:2px solid var(--ink);position:relative;min-height:128px;display:flex;flex-direction:column;justify-content:space-between;background:var(--paper)}
.steps li:last-child{border-right:0;background:var(--red)}
.steps{padding:0;margin:0}
.steps b{font-family:var(--disp);font-weight:400;font-size:40px;line-height:1;color:var(--red)}
.steps li:last-child b{color:var(--ink)}
.steps span{font-family:var(--mono);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;line-height:1.35}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
.card{border:2px solid var(--ink);padding:14px;min-height:170px;display:flex;flex-direction:column;justify-content:space-between;transition:background .15s,transform .15s}
.card:hover{background:var(--ink);color:var(--paper);transform:translate(-3px,-3px);box-shadow:6px 6px 0 var(--red)}
.card i{font-style:normal;width:30px;height:30px;border-radius:50%;background:var(--red);color:var(--white);display:grid;place-items:center;font-family:var(--mono);font-weight:700;font-size:13px}
.card h3{margin:0 0 4px;font-family:var(--disp);font-weight:400;text-transform:uppercase;font-size:28px;line-height:1}
.card p{margin:0;font-size:14px}
.press{display:grid;grid-template-columns:repeat(2,1fr);gap:20px}
.press a{border:2px solid var(--ink);padding:16px;text-decoration:none;display:flex;flex-direction:column;gap:14px;justify-content:space-between;min-height:170px;transition:background .15s,transform .15s,box-shadow .15s}
.press a:hover{background:var(--red);transform:translate(-3px,-3px);box-shadow:6px 6px 0 var(--ink)}
.press strong{font-family:var(--disp);font-weight:400;text-transform:uppercase;font-size:clamp(20px,2.2vw,30px);line-height:1.02}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.shots{display:grid;grid-template-columns:repeat(12,1fr);gap:20px}
.shots figure{margin:0;grid-column:span var(--w);min-width:0}
.shots .fr{border:2px solid var(--ink);overflow:hidden;background:#fff;aspect-ratio:var(--r)}
.shots .fr img{width:100%;height:100%;object-fit:cover;transition:transform .5s}
.shots .fr.contain img{object-fit:contain;padding:10px}
.shots figure:hover .fr img{transform:scale(1.04)}
.shots figcaption{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;margin-top:8px}
.shots .slot{aspect-ratio:var(--r);height:auto}
/* ---------- pagina progetto "pulita": testo in alto, poi solo immagini senza cornici ---------- */
.ph.cl{padding-bottom:clamp(40px,6.5vw,104px)}
.ph.cl .ph-grid{margin-top:clamp(18px,2.6vw,36px)}
.cl-tx{grid-column:7/-1}
.cl-lead{margin:0;font-size:clamp(18px,1.75vw,26px);line-height:1.28;font-weight:500;letter-spacing:-.01em}
.cl-tags{list-style:none;margin:clamp(20px,2.6vw,38px) 0 0;padding:0;color:#6B6863;font-size:clamp(16px,1.4vw,21px);line-height:1.42}
.cl-meta{margin:clamp(20px,2.6vw,38px) 0 0;color:#6B6863;font-size:13px}
.gal2{display:grid;gap:14px;padding:0 var(--pad)}
.gal2.end{margin-bottom:clamp(28px,5vw,64px)}
.gr{display:grid;grid-template-columns:repeat(var(--c),1fr);gap:14px}
.gr figure{margin:0;overflow:hidden;aspect-ratio:3/2;background:#DDDAD4}
.gr img{width:100%;height:100%;object-fit:cover;transition:transform .7s}
.gr figure:hover img{transform:scale(1.03)}
.tcols{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(20px,3.2vw,48px);padding:clamp(48px,7.5vw,120px) var(--pad)}
.tcols h2{margin:0 0 14px;font-family:var(--disp);font-weight:400;text-transform:uppercase;font-size:clamp(24px,2.5vw,38px);line-height:1}
.tcols h2 small{display:block;font-family:var(--mono);font-size:12px;color:var(--red);font-weight:700;letter-spacing:.08em;margin-bottom:10px}
.tcols p{margin:0 0 .8em;font-size:clamp(15px,1.15vw,17px);line-height:1.52;max-width:44ch}
.slot{aspect-ratio:4/3;border:2px dashed var(--ink);background:repeating-linear-gradient(135deg,transparent 0 14px,rgba(20,20,20,.07) 14px 15px);display:grid;place-items:center;text-align:center;padding:12px;color:var(--grey)}
.gal{display:grid;grid-template-columns:repeat(12,1fr);gap:20px}
.gal figure{margin:0;border:2px solid var(--ink);background:var(--white);overflow:hidden}
.gal figure img{width:100%;height:100%;object-fit:cover;transition:transform .5s}
.gal figure:hover img{transform:scale(1.04)}
.gal .a{grid-column:1/8;aspect-ratio:1/1}
.gal .b{grid-column:8/-1;aspect-ratio:5/7.18}
.gal .c{grid-column:1/-1;aspect-ratio:16/8}
.gal figcaption{position:absolute}
.cap{display:flex;justify-content:space-between;margin-top:8px}
.next{display:flex;justify-content:space-between;align-items:center;gap:20px;margin:0 var(--pad) clamp(28px,5vw,64px);padding:18px 20px;background:var(--ink);color:var(--paper);text-decoration:none;transition:background .15s,color .15s}
.next:hover{background:var(--red);color:var(--ink)}
.next strong{font-family:var(--disp);font-weight:400;text-transform:uppercase;font-size:clamp(34px,6vw,90px);line-height:.95}
.big-n{font-family:var(--disp);font-size:clamp(48px,7vw,110px);line-height:.9;text-align:right;padding:0 var(--pad) 12px}
.big-n em{font-style:normal;color:var(--red)}

/* ---------- about / contact ---------- */
.ab{display:grid;grid-template-columns:repeat(12,1fr);gap:20px;padding:0 var(--pad) clamp(28px,5vw,64px);margin-top:20px}
.ab-photo{grid-column:1/5;position:relative;align-self:start}
.ab-photo img.me{width:100%;border:2px solid var(--ink)}
.ab-photo::after{content:"";position:absolute;inset:0;background:var(--red);mix-blend-mode:multiply;opacity:.0;transition:opacity .25s;pointer-events:none}
.ab-photo:hover::after{opacity:.85}
.ab-photo .m{position:absolute;right:-18px;bottom:-26px;width:38%;z-index:2}
.ab-tx{grid-column:6/-1}
.ab-tx .big{font-size:clamp(20px,2.1vw,30px);line-height:1.32;font-weight:500;margin:0 0 1em}
.ab-tx .big b{background:var(--red);padding:0 .15em;font-weight:600}
.lst{border-top:2px solid var(--ink);margin-top:22px}
.lst h3{font-family:var(--mono);font-size:12px;color:var(--red);letter-spacing:.08em;text-transform:uppercase;margin:12px 0 4px}
.lst ul{list-style:none;margin:0;padding:0}
.lst li{display:flex;justify-content:space-between;gap:16px;padding:9px 0;border-bottom:1px solid var(--ink);font-size:15px}
.lst li span:last-child{font-family:var(--mono);font-size:12px;text-align:right;color:var(--grey);white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chips span{border:2px solid var(--ink);padding:5px 10px;font-family:var(--mono);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.chips span:hover{background:var(--red)}
.ct{display:grid;grid-template-columns:repeat(12,1fr);gap:20px;padding:0 var(--pad) clamp(28px,5vw,64px);align-items:center}
.ct-m{grid-column:1/5;background:none;border:0;padding:0}
.ct-m img{width:100%;transform-origin:50% 80%;transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
.ct-m:hover img{transform:scale(1.07,1.14) rotate(-2deg)}
.ct-tx{grid-column:6/-1}
.ct-tx .mail{font-family:var(--disp);text-transform:uppercase;font-size:clamp(24px,4.2vw,64px);line-height:1;word-break:break-all;margin:0 0 16px}
.ct-links{display:flex;flex-wrap:wrap;gap:12px}

/* ---------- footer ---------- */
footer{background:var(--ink);color:var(--paper);margin-top:0}
.ft{display:grid;grid-template-columns:repeat(12,1fr);gap:20px;padding:clamp(24px,4vw,48px) var(--pad)}
.ft div{grid-column:span 3}
.ft h4{font-family:var(--mono);font-size:11px;color:var(--red2);letter-spacing:.1em;text-transform:uppercase;margin:0 0 6px}
.ft p{margin:0;font-size:15px}
.ft a{text-decoration-color:var(--red)}
.walk{position:relative;height:84px;overflow:hidden;border-top:1px solid #333}
.walk img{position:absolute;bottom:6px;height:70px;width:auto;animation:walk 22s linear infinite}
.walk img:nth-child(2){animation-delay:-9s;height:54px}
@keyframes walk{from{left:-140px}to{left:100%}}

.view{animation:in .35s ease}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

@media (max-width:860px){
  .hero h1{grid-column:1/-1}.hero-side{grid-column:1/-1}
  /* titolo a tutta larghezza, sotto testo a sinistra e sticker a destra in un box fisso (le immagini hanno proporzioni diverse) */
  .row{row-gap:12px;grid-template-columns:1fr 40%}.row .n{display:none}.row .tt{grid-column:1/-1}.row .bl{grid-column:1;grid-row:2}.row .go{grid-column:1;grid-row:3;justify-self:start}
  .row .peek{position:static;grid-column:2;grid-row:2/4;width:100%;height:180px;object-fit:contain;transform:rotate(-6deg) scale(1)}
  .ph-tag,.ph-lead{grid-column:1/-1}.ph-masc{right:4px;top:auto;bottom:-16px;width:78px}.ph-tag{padding-right:84px}
  .facts{grid-template-columns:repeat(2,1fr)}.facts div{padding-left:0;border-right:0;border-bottom:1px solid var(--ink)}
  .blk h2,.blk .tx{grid-column:1/-1}
  .press{grid-template-columns:1fr}.cards{grid-template-columns:repeat(2,1fr)}.slots{grid-template-columns:1fr}
  .shots figure{grid-column:1/-1}
  .cl-tx{grid-column:1/-1}.tcols{grid-template-columns:1fr;gap:28px}
  .gr{grid-template-columns:1fr}.gal2,.gr{gap:10px}
  .ab-photo{grid-column:1/-1;max-width:340px}.ab-tx{grid-column:1/-1}
  .ct-m{grid-column:3/11}.ct-tx{grid-column:1/-1}
  .ft div{grid-column:span 6}
  .steps li{border-right:0;border-bottom:2px solid var(--ink);min-height:90px}
  /* cane accanto al nome: hero-side si scioglie nella griglia dell'hero */
  .hero-side{display:contents}.hero h1{grid-row:2}.tagbox,.hero-lead{grid-column:1/-1}
  .stage{grid-column:7/-1;grid-row:2;min-height:0}.stage .stk{width:100%;left:auto;right:0;top:auto;bottom:0}.stage-hint{display:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto}}
</style>
</head>
<body>
<header class="top">

  it:{cat:'Ricerca · Biomateriali',tag:'Dal granchio blu alla chitina green',year:'2023 — 2025',role:'Ricerca e sperimentazione, co-autore del paper',status:'Preprint pubblico (2025)',
      lead:'Estrarre chitina dal carapace del granchio blu con la fermentazione batterica, al posto della chimica pesante.',

      blocks:[
       {h:'Il problema',p:['Il granchio blu (Callinectes sapidus) è una specie aliena che sta causando danni per milioni di euro alla pesca. Il suo carapace però è ricco di chitina, il secondo biopolimero più abbondante in natura, utile in agricoltura, alimentare, biomedicale e cosmetica.','Quasi tutta la chitina in commercio si ottiene con processi chimici molto inquinanti: per purificarne circa 5 g servono oltre 200 ml di NaOH, altri 200 ml di HCl e molta acqua per i lavaggi.']},

 </g>
 <g font-family="Anton,Inter,sans-serif" font-size="46" fill="#141414" text-anchor="middle"><text x="268" y="72">+</text><text x="492" y="72">+</text></g>
 <g font-family="JetBrains Mono,monospace" font-size="13" font-weight="700" fill="#141414" text-anchor="middle" letter-spacing="1">
  <text x="140" y="214">A</text><text x="380" y="112">NFC</text><text x="620" y="214">B</text></g>

function block(b,i){
  let inner='';
  if(b.svg==='bracelet')inner+=`<div class="wide" style="margin-top:6px">${BR}</div>`;
  if(b.steps)inner+=`<ol class="steps wide">${b.steps.map((s,k)=>`<li><b>${pad(k+1)}</b><span>${esc(s)}</span></li>`).join('')}</ol>`;
  if(b.press)inner+=`<div class="press wide">${b.press.map(c=>`<a href="${c[3]}" target="_blank" rel="noopener"><span class="mono">${esc(c[0])} · ${esc(c[1])}</span><strong>${esc(c[2])}</strong><span class="mono">${lang==='it'?'Leggi l\'articolo':'Read the article'} ↗</span></a>`).join('')}</div>`;
  if(b.cards)inner+=`<div class="cards wide">${b.cards.map((c,k)=>`<div class="card"><i>${k+1}</i><div><h3>${esc(c[0])}</h3><p>${esc(c[1])}</p></div></div>`).join('')}</div>`;
  const tx=(b.p||[]).map(x=>`<p>${esc(x)}</p>`).join('')+(b.link?`<p><a class="btn" href="${b.link[1]}" target="_blank" rel="noopener">${esc(b.link[0])} ↗</a></p>`:'');
  return `<div class="blk"><h2><small>${pad(i+1)}</small>${esc(b.h)}</h2>${tx?`<div class="tx">${tx}</div>`:''}${inner}</div>`;
}
/* Pagina progetto "pulita": p.lay dice quante immagini stanno in ogni riga, es. [1,3,1].
   La prima riga va subito sotto l'introduzione, poi i testi su tre colonne, poi le altre righe. */
function projectClean(p,i,d,n){
  const tags=d.role.split(/\s*[,·]\s*/).filter(Boolean).map(x=>x[0].toUpperCase()+x.slice(1));
  let k=0;
  const rows=p.lay.map(c=>`<div class="gr" style="--c:${c}">${p.shots.slice(k,k+=c).map(x=>`<figure><img src="img/${x.s}.jpg" alt="${esc(x[lang])}"></figure>`).join('')}</div>`);
  const plain=b=>b.p&&!b.steps&&!b.cards&&!b.press;
  const txt=d.blocks.filter(plain),rest=d.blocks.filter(b=>!plain(b));
  return `<section class="ph cl">
    <div class="ph-meta mono"><a href="#work" class="back" style="text-decoration:none">${t('back')}</a><span>${esc(d.cat)}</span></div>
    <h1 class="disp">${esc(d.title||p.title)}</h1>
    <div class="ph-grid">
      <div class="ph-tag">${esc(d.tag)}<button class="stk ph-masc" type="button" style="--ms:${p.ms||1};--r:8deg;transform:rotate(8deg)" aria-label="Sticker"><img src="img/m${p.m}.png" alt="" draggable="false"></button></div>
      <div class="cl-tx">
        <p class="cl-lead">${esc(d.lead)}</p>
        <ul class="cl-tags">${tags.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>
        <p class="mono cl-meta">${esc(d.year)} — ${esc(d.cat)} / ${esc(d.status)}</p>
      </div>
    </div>
  </section>
  <section class="gal2">${rows[0]}</section>
  <section class="tcols">${txt.map((b,j)=>`<div><h2><small>${pad(j+1)}</small>${esc(b.h)}</h2>${b.p.map(x=>`<p>${esc(x)}</p>`).join('')}${b.link?`<p><a class="btn" href="${b.link[1]}" target="_blank" rel="noopener">${esc(b.link[0])} ↗</a></p>`:''}</div>`).join('')}</section>
  <section class="gal2 end">${rows.slice(1).join('')}</section>
  ${rest.length?`<section class="body">${rest.map(block).join('')}</section>`:''}
  <div class="big-n">${pad(i+1)}<em>/</em>${pad(P.length)}</div>
  <a class="next" href="#${n.id}"><span class="mono">${t('next')}</span><strong>${esc(n[lang].title||n.title)} →</strong></a>`;
}
function project(p){
  const i=P.indexOf(p),d=p[lang],n=P[(i+1)%P.length];
  if(p.lay)return projectClean(p,i,d,n);
  const media=`<div class="blk"><div class="wide shots">${p.shots.map((x,k)=>x.slot
     ?`<figure style="--w:${x.w}"><div class="slot mono" style="--r:${x.r}">${esc(t(x.more?'more':'slot'))}</div></figure>`
     :`<figure style="--w:${x.w}"><div class="fr${x.fit?' contain':''}" style="--r:${x.r}"><img src="img/${x.s}.jpg" alt="${esc(x[lang])}"></div><figcaption>${pad(k+1)} — ${esc(x[lang])}</figcaption></figure>`).join('')}</div>${p.credit?`<p class="wide mono" style="margin:14px 0 0;color:var(--mid)">${esc(lang==='it'?'Illustrazioni: ':'Illustrations: ')}${esc(p.credit)}</p>`:''}</div>`;
  return `<section class="ph">
    <div class="ph-meta mono"><a href="#work" class="back" style="text-decoration:none">${t('back')}</a><span>${esc(d.cat)}</span></div>
    <h1 class="disp">${esc(d.title||p.title)}</h1>
    <div class="ph-grid">
      <div class="ph-tag">${esc(d.tag)}<button class="stk ph-masc" type="button" style="--ms:${p.ms||1};--r:8deg;transform:rotate(8deg)" aria-label="Sticker"><img src="img/m${p.m}.png" alt="" draggable="false"></button></div>
      <p class="ph-lead">${esc(d.lead)}</p>
    </div>
  </section>
  <dl class="facts">
    <div><dt>${t('role')}</dt><dd>${esc(d.role)}</dd></div>
    <div><dt>${t('when')}</dt><dd>${esc(d.year)}</dd></div>
    <div><dt>${t('what')}</dt><dd>${esc(d.cat)}</dd></div>
    <div><dt>${t('status')}</dt><dd>${esc(d.status)}</dd></div>
  </dl>
  <section class="body">${d.blocks.map(block).join('')}${media}</section>
  <div class="big-n">${pad(i+1)}<em>/</em>${pad(P.length)}</div>
  <a class="next" href="#${n.id}"><span class="mono">${t('next')}</span><strong>${esc(n[lang].title||n.title)} →</strong></a>`;
}
function about(){
  const a=ABOUT[lang];const li=l=>l.map(x=>`<li><span>${esc(x[0])}</span><span>${esc(x[1])}</span></li>`).join('');
  return `<section class="sec" style="padding-bottom:0"><div class="sec-head"><h2>${t('about')}</h2><span class="mono">ET / ${t('portfolio')}</span></div></section>
  <section class="ab">
    <div class="ab-photo"><img class="me" src="img/me.jpg" alt="Edoardo Tuccio"><button class="stk m" type="button" style="--r:-8deg;transform:rotate(-8deg)" aria-label="Sticker"><img src="img/m1.png" alt="" draggable="false"></button></div>
    <div class="ab-tx">
      <p class="big">${a.big}</p><p>${esc(a.p)}</p>
      <div class="lst"><h3>${a.sk}</h3><div class="chips">${a.skL.map(s=>`<span>${esc(s)}</span>`).join('')}</div></div>
      <div class="lst"><h3>${a.edu}</h3><ul>${li(a.eduL)}</ul></div>
      <div class="lst"><h3>${a.lg}</h3><ul>${li(a.lgL)}</ul></div>
      <div class="lst"><h3>${a.xp}</h3><ul>${li(a.xpL)}</ul></div>
    </div>
  </section>`;
}
function contact(){
  return `<section class="sec" style="padding-bottom:20px"><div class="sec-head"><h2>${t('contact')}</h2><span class="mono">${t('basedV')}</span></div></section>
  <section class="ct">
    <button class="ct-m stk" type="button" style="position:relative" aria-label="Sticker"><img src="img/m4.png" alt="" draggable="false"></button>
    <div class="ct-tx">
      <p class="mono" style="margin:0 0 14px;max-width:46ch;line-height:1.6">${esc(t('contactLead'))}</p>
      <p class="mail">${EMAIL}</p>
      <div class="ct-links">
        <button class="btn" type="button" id="copy">${t('copy')}</button>
        <a class="btn" href="mailto:${EMAIL}">${t('write')} ↗</a>
        <a class="btn" href="${IG}" target="_blank" rel="noopener">Instagram @edoardo_tuccio ↗</a>
        <a class="btn" href="https://kobond.app" target="_blank" rel="noopener">kobond.app ↗</a>
      </div>
    </div>
  </section>`;
}
function footer(){
  $('#foot').innerHTML=`${marquee(t('mq2'),'dark')}
  <div class="ft">
    <div><h4>${t('based')}</h4><p>${t('basedV')}</p></div>
    <div><h4>${t('contact')}</h4><p>${EMAIL}</p></div>
    <div><h4>${t('social')}</h4><p><a href="${IG}" target="_blank" rel="noopener">Instagram</a></p></div>
    <div><h4>${t('also')}</h4><p><a href="https://kobond.app" target="_blank" rel="noopener">kobond.app</a></p></div>
  </div>
  <div class="walk" aria-hidden="true"><img src="img/m3.png" alt=""><img src="img/m3.png" alt=""></div>`;
}
function nav(cur){
  const items=[['work',t('work')],['about',t('about')],['contact',t('contact')]];
  $('#nav').innerHTML=items.map(i=>`<a href="#${i[0]}" class="${cur===i[0]?'on':''}">${i[1]}</a>`).join('');
  document.querySelectorAll('.lang button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.lang===lang));
  document.documentElement.lang=lang;
}
function render(keepScroll){
  const h=(location.hash||'#home').slice(1);
  const p=P.find(x=>x.id===h);
  const html=p?project(p):h==='work'?work():h==='about'?about():h==='contact'?contact():home();
  $('#app').innerHTML=`<div class="view">${html}</div>`;
  nav(p?'work':h);footer();stickers();
  const c=$('#copy');
  if(c)c.addEventListener('click',()=>{const done=()=>{c.textContent=t('copied');setTimeout(()=>c.textContent=t('copy'),1600)};
    try{navigator.clipboard.writeText(EMAIL).then(done,()=>{})}catch(e){}});
  if(!keepScroll)window.scrollTo(0,0);
}

/* ---------- stickers: trascina, stacca, riattacca; clic = fumetto ---------- */
let wanderers=[],raf=0;
const still=window.matchMedia&&matchMedia('(prefers-reduced-motion:reduce)').matches;
function tick(now){
  wanderers.forEach(w=>{
    if(!w.el.isConnected||w.el.classList.contains('drag'))return;
    if(now>w.next){const a=Math.random()*Math.PI*2,r=Math.random()*w.rad;w.tx=Math.cos(a)*r;w.ty=Math.sin(a)*r*.7;w.next=now+1400+Math.random()*2200}
    w.x+=(w.tx-w.x)*.018;w.y+=(w.ty-w.y)*.018;
    w.el.style.translate=w.x.toFixed(1)+'px '+w.y.toFixed(1)+'px';
  });
  raf=requestAnimationFrame(tick);
}
function stickers(){
  cancelAnimationFrame(raf);wanderers=[];
  document.querySelectorAll('.stk').forEach(el=>{
    if(!still&&!el.classList.contains('ct-m'))wanderers.push({el,rad:+(el.dataset.rad||12),x:0,y:0,tx:0,ty:0,next:0});
    let sx,sy,ox,oy,moved=false,down=false;
    el.addEventListener('pointerdown',e=>{
      if(el.classList.contains('ct-m'))return;
      down=true;moved=false;sx=e.clientX;sy=e.clientY;ox=el.offsetLeft;oy=el.offsetTop;
      el.setPointerCapture(e.pointerId);
    });
    el.addEventListener('pointermove',e=>{
      if(!down)return;const dx=e.clientX-sx,dy=e.clientY-sy;
      if(!moved&&Math.hypot(dx,dy)<5)return;
      if(!moved){moved=true;el.classList.add('drag');el.style.right='auto';el.style.bottom='auto'}
      el.style.left=(ox+dx)+'px';el.style.top=(oy+dy)+'px';
    });
    const up=()=>{
      if(!down)return;down=false;
      if(moved){el.classList.remove('drag');const r=(Math.random()*24-12).toFixed(1);el.style.setProperty('--r',r+'deg');el.style.transform=`rotate(${r}deg)`}
    };
    el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);
    el.addEventListener('click',()=>{
      if(moved){moved=false;return}
      el.classList.remove('pop');void el.offsetWidth;el.classList.add('pop');
      const old=el.querySelector('.bubble');if(old)old.remove();
      const L=t('lines'),b=document.createElement('span');b.className='bubble';b.textContent=L[Math.floor(Math.random()*L.length)];
      el.appendChild(b);setTimeout(()=>b.remove(),1500);
    });
  });
  if(wanderers.length)raf=requestAnimationFrame(tick);
}
document.querySelectorAll('.lang button').forEach(b=>b.addEventListener('click',()=>{
  lang=b.dataset.lang;try{localStorage.setItem('et-lang',lang)}catch(e){};render(true);
}));
document.addEventListener('click',e=>{
  const a=e.target.closest&&e.target.closest('a[href^="#"]');if(!a)return;
  e.preventDefault();const h=a.getAttribute('href');
  if(location.hash===h){render()}else{location.hash=h}
});
window.addEventListener('hashchange',()=>render());
render();
</script>
